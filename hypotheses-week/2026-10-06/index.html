<script>
const D = JSON.parse(document.getElementById("report").textContent);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; };
const TONES = ["good", "bad", "warn", "neutral"];
const tone = t => (TONES.includes(t) ? t : "neutral");
const signTone = s => /^\s*[+]/.test(s) ? "good" : (/^\s*[−-]\d/.test(s) ? "bad" : "neutral");

document.getElementById("eyebrow").textContent = D.eyebrow || "";
document.getElementById("title").textContent = D.title;
document.getElementById("lede").textContent = D.lede || "";

const V = {
  stats(v) { const w = el("div", "tiles"); (v.items || []).forEach((it, i) => { const t = el("div", "tile r"); t.style.setProperty("--d", (0.3 + i * 0.15) + "s");
      t.append(el("b", tone(it.tone), it.value), el("span", null, it.label)); w.append(t); }); return w; },
  table(v) { const t = el("table", "r"); t.style.setProperty("--d", ".3s"); const hr = el("tr"); (v.columns || []).forEach(c => hr.append(el("th", null, c)));
      const th = el("thead"); th.append(hr); const tb = el("tbody");
      (v.rows || []).forEach(row => { const tr = el("tr"); row.forEach(c => tr.append(el("td", signTone(String(c)), c))); tb.append(tr); });
      t.append(th, tb); return t; },
  bars(v) { const w = el("div", "vis-bars"); const items = v.items || []; const max = Math.max(1e-9, ...items.map(it => Math.abs(+it.value || 0)));
      const hasNeg = items.some(it => +it.value < 0);
      items.forEach((it, i) => { const row = el("div", "bar r"); row.style.setProperty("--d", (0.3 + i * 0.2) + "s"); const tr = el("div", "track");
        const val = +it.value || 0; const f = el("div", "fill" + (val < 0 ? " neg" : "")); const span = Math.abs(val) / max * (hasNeg ? 50 : 100);
        f.style.width = span + "%"; f.style.left = hasNeg ? (val < 0 ? (50 - span) + "%" : "50%") : "0";
        f.style.background = `var(--${({good: "gain", bad: "loss", warn: "amber"})[tone(it.tone || (val >= 0 ? "good" : "bad"))] || "muted"})`;
        f.style.setProperty("--d", (0.6 + i * 0.2) + "s"); tr.append(f); if (hasNeg) { const z = el("div", "zero"); z.style.left = "50%"; tr.append(z); }
        row.append(el("span", null, it.label), tr, el("span", "val " + tone(it.tone || (val >= 0 ? "good" : "bad")), it.text || ((val > 0 ? "+" : "") + val + (it.unit || ""))));
        w.append(row); }); w.style.display = "grid"; w.style.gap = "1.2cqw"; return w; },
  chips(v) { const w = el("div", "chips"); (v.items || []).forEach((it, i) => { const c = el("span", "chip r " + tone(it.tone), it.text); c.style.setProperty("--d", (0.3 + i * 0.12) + "s"); w.append(c); }); return w; },
  verdict(v) { const w = el("div", "verdict"); const a = el("div", "box r"); a.style.setProperty("--d", ".3s"); a.append(el("small", null, "Правило"), document.createTextNode(v.rule || ""));
      const b = el("div", "box r"); b.style.setProperty("--d", ".6s"); b.append(el("small", null, "Результат на истории"), document.createTextNode(v.result || ""));
      const s = el("div", "stamp " + (v.verdict === "pass" ? "good" : "bad"), v.verdict === "pass" ? "✓ прошла" : "✕ не прошла");
      w.append(a, b, s); if (v.counter) { const c = el("div", "box r"); c.style.setProperty("--d", "1.5s"); c.textContent = v.counter; w.append(c); } return w; },
  progress(v) { const w = el("div", "vis-prog"); w.style.display = "grid"; w.style.gap = "1.6cqw";
      (v.items || []).forEach((it, i) => { const p = el("div", "prog r"); p.style.setProperty("--d", (0.3 + i * 0.2) + "s"); const head = el("div");
        head.append(el("span", null, it.label + ": "), el("b", tone(it.tone), `${it.current} / ${it.target}`)); const tr = el("div", "track");
        const f = el("div", "fill"); f.style.left = "0"; f.style.width = Math.min(100, (+it.current || 0) / Math.max(1, +it.target || 1) * 100) + "%"; f.style.background = "var(--amber)";
        tr.append(f); p.append(head, tr); w.append(p); }); return w; },
};

const stage = document.getElementById("stage");
const NARR = [];
D.scenes.forEach((sc, i) => {
  const s = el("section", "scene"); s.dataset.title = sc.chapter || sc.title; s.dataset.frog = ["bored", "happy", "shocked", "sad"].includes(sc.frog) ? sc.frog : "bored";
  const t = el("div", "txt"); const k = el("span", "kicker r", sc.kicker || ""); const h = el("h2", "r", sc.title); h.style.setProperty("--d", ".1s"); t.append(k, h);
  if (sc.note) { const n = el("p", "note r", sc.note); n.style.setProperty("--d", ".25s"); t.append(n); }
  const vis = el("div", "vis"); const kind = sc.visual && V[sc.visual.type]; if (kind) vis.append(kind(sc.visual));
  s.append(t, vis); stage.append(s); NARR.push(sc.lines);
});
const tr = document.getElementById("transcript");
D.scenes.forEach((sc, i) => { tr.append(el("h3", null, (i + 1) + ". " + (sc.chapter || sc.title)), el("p", null, sc.lines.join(" "))); });
if (Array.isArray(D.archive) && D.archive.length) {
  const box = document.getElementById("archiveBox"), a = document.getElementById("archive"); box.hidden = false;
  D.archive.forEach(it => { const l = el("a", null, it.label); if (/^(\.\.\/)?[0-9a-z-]+\/$/.test(it.href)) l.href = it.href; a.append(l); });
}

// ---- player: browser speech synthesis, autoplay muted with subtitles ----
const scenes = [...document.querySelectorAll(".scene")];
const subEl = document.getElementById("sub"), where = document.getElementById("where"), chapters = document.getElementById("chapters");
const playBtn = document.getElementById("play"), playTxt = document.getElementById("playTxt"), playIcon = document.getElementById("playIcon");
const soundBtn = document.getElementById("sound"), soundTxt = document.getElementById("soundTxt"), voiceNote = document.getElementById("voiceNote");
const frog = document.getElementById("frog");
const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
let idx = 0, line = 0, playing = false, sound = false, gen = 0, timer = null, voice = null, finished = false;
const talk = on => frog.classList.toggle("talking", !!on);
scenes.forEach((s, i) => { const b = el("button"); b.type = "button"; const seg = el("span", "seg"); seg.append(el("i")); b.append(seg, el("span", "lbl", s.dataset.title));
  b.setAttribute("aria-label", `Сцена ${i + 1}: ${s.dataset.title}`); b.addEventListener("click", () => start(i)); chapters.append(b); });
const chapBtns = [...chapters.children];
function pickVoice() { if (!synth) return null; const ru = synth.getVoices().filter(v => /^ru/i.test(v.lang));
  return ru.find(v => /Milena|Google|Yuri|Katya|Irina|Pavel|Svetlana|Dariya/i.test(v.name)) || ru[0] || null; }
if (synth) { voice = pickVoice(); synth.onvoiceschanged = () => { voice = pickVoice(); }; }
function showScene(i) {
  scenes.forEach((s, k) => { s.classList.toggle("on", k === i); if (k !== i) s.classList.remove("run"); });
  const s = scenes[i]; s.classList.remove("run"); void s.offsetWidth; s.classList.add("run");
  chapBtns.forEach((b, k) => { b.classList.toggle("done", k < i); b.setAttribute("aria-current", k === i ? "true" : "false"); });
  where.textContent = `${i + 1} / ${scenes.length}`; frog.dataset.emotion = s.dataset.frog;
}
function setSeg() { chapBtns[idx].querySelector("i").style.width = Math.round(line / NARR[idx].length * 100) + "%"; }
function ui() {
  playTxt.textContent = playing ? "Пауза" : (finished ? "Сначала" : "Смотреть"); playBtn.setAttribute("aria-label", playTxt.textContent);
  playIcon.innerHTML = playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M7 5v14l12-7z"/>';
  soundBtn.setAttribute("aria-pressed", String(sound)); soundTxt.textContent = sound ? "Озвучка включена" : "Озвучка"; stage.classList.toggle("paused", !playing);
}
function stopTimers() { gen++; clearTimeout(timer); if (synth) synth.cancel(); talk(false); }
function finish() { playing = false; finished = true; talk(false); chapBtns.forEach(b => b.classList.add("done")); ui(); }
function start(i) { stopTimers(); finished = false; chapBtns.forEach(b => b.querySelector("i").style.width = ""); idx = i; line = 0; playing = true; showScene(i); ui(); step(gen); }
function step(g) {
  if (g !== gen) return; const L = NARR[idx]; setSeg();
  if (line >= L.length) { timer = setTimeout(() => { if (g !== gen) return; idx < scenes.length - 1 ? start(idx + 1) : finish(); }, 700); return; }
  const text = L[line]; subEl.textContent = text; talk(true);
  const next = () => { if (g !== gen) return; talk(false); line++; timer = setTimeout(() => step(g), 120); };
  if (sound && synth && voice) {
    const u = new SpeechSynthesisUtterance(text); u.voice = voice; u.lang = voice.lang; u.rate = 1; let done = false;
    const safety = setTimeout(() => { if (!done) { done = true; next(); } }, text.length * 120 + 5000);
    u.onend = u.onerror = () => { if (done) return; done = true; clearTimeout(safety); next(); }; synth.speak(u);
  } else { timer = setTimeout(next, Math.max(2600, text.length * 70)); }
}
function pause() { stopTimers(); playing = false; ui(); }
function resume() { if (finished) { start(0); return; } playing = true; ui(); step(++gen); }
playBtn.addEventListener("click", () => (playing ? pause() : resume()));
document.getElementById("prev").addEventListener("click", () => start(Math.max(0, idx - 1)));
document.getElementById("next").addEventListener("click", () => start(Math.min(scenes.length - 1, idx + 1)));
soundBtn.addEventListener("click", () => {
  if (!synth) { voiceNote.textContent = "Этот браузер не умеет синтез речи. Ролик идёт с субтитрами."; return; }
  voice = voice || pickVoice(); if (!sound && !voice) { voiceNote.textContent = "В этом браузере нет русского голоса. Ролик идёт с субтитрами."; return; }
  sound = !sound; ui(); if (playing) { stopTimers(); step(gen); }
});
document.addEventListener("keydown", e => { if (e.target.closest("button, summary, a")) return;
  if (e.code === "Space") { e.preventDefault(); playing ? pause() : resume(); }
  if (e.code === "ArrowRight") start(Math.min(scenes.length - 1, idx + 1)); if (e.code === "ArrowLeft") start(Math.max(0, idx - 1)); });
document.addEventListener("visibilitychange", () => { if (document.hidden && playing) pause(); });
frog.classList.add("hello"); setTimeout(() => frog.classList.remove("hello"), 1800);
start(0);
</script>
